<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Latent Loops Grid</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 128px);
            grid-auto-rows: 128px;
            gap: 10px;
        }
        video {
            width: 128px;
            height: 128px;
            object-fit: cover;
            border: 2px solid #444;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h1 style="color:white;">Latent Loop Gallery</h1>
<div id="grid" class="grid"></div>

<script>
async function loadGrid() {
    const response = await fetch('gif_gridpositions.json');
    const gridData = await response.json();

    const gridContainer = document.getElementById('grid');

    // gridData should map filename -> [row, col]
    const entries = Object.entries(gridData);

    // Sort by (row, col)
    entries.sort((a, b) => {
        const [rowA, colA] = a[1];
        const [rowB, colB] = b[1];
        return rowA - rowB || colA - colB;
    });

    for (const [filename, _pos] of entries) {
        const baseName = filename.replace('.gif', '.mp4');
        const video = document.createElement('video');
        video.src = `loops/${baseName}`;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        gridContainer.appendChild(video);
    }
}

loadGrid();
</script>

</body>
</html>
