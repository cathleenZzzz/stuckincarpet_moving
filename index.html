<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Moving Carpet Grid</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            position: absolute;
            width: 64px;
            height: 64px;
            object-fit: cover;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="container"></div>

<script>
fetch('gif_gridpositions.json')
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById('container');

        for (const [filename, pos] of Object.entries(data)) {
            const mp4name = filename.replace('.gif', '.mp4'); // <-- 🔥 Fix here!
            const video = document.createElement('video');
            video.src = `gifs/${mp4name}`;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;

            video.style.left = (pos[0] * window.innerWidth) + 'px';
            video.style.top = (pos[1] * window.innerHeight) + 'px';

            container.appendChild(video);
        }
    })
    .catch(error => {
        console.error('Error loading positions JSON:', error);
    });
</script>
</body>
</html>
